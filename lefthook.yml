pre-commit:
  parallel: true
  commands:
    biome:
      glob: '*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}'
      run: pnpm biome check --write {staged_files}
      stage_fixed: true
    gitleaks:
      # Scans staged files for secrets/credentials before allowing commit
      # Install: brew install gitleaks (macOS) or see https://github.com/gitleaks/gitleaks
      run: gitleaks protect -v --staged

# Pre-push: run checks only for changed (pushed) files.
# - biome-ci: only on pushed *.{js,ts,...} files
# - typecheck: only when at least one TS/TSX file is pushed (still runs full tsc)
# - test: only tests affected by pushed changes (vitest --changed)
pre-push:
  parallel: true
  commands:
    biome-ci:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: pnpm biome ci --error-on-warnings {push_files}
    typecheck:
      glob: "*.{ts,tsx,mts,cts}"
      run: pnpm typecheck
    test:
      run: pnpm test:run
